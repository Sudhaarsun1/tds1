# .github/workflows/caching.yml

name: Caching Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache npm dependencies
        # This ID is the correct one to reference
        id: cache-npm-deps 
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cache-9e62e67

      - name: prime-cache-9e62e67
        # This step correctly references 'cache-npm-deps'
        run: echo "Cache hit status: ${{ steps.cache-npm-deps.outputs.cache-hit }}"

      - name: Install dependencies if cache missed
        # This condition also correctly references 'cache-npm-deps'
        if: steps.cache-npm-deps.outputs.cache-hit != 'true'
        run: npm install
